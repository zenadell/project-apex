<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APEX — Control Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
               GLOBAL DESIGN SYSTEM TOKENS
               ============================================================ */
        :root {
            --color-primary: #00f0ff;
            --color-secondary: #7b2ff7;
            --color-accent: #ff2d55;
            --color-bg: #0a0a0f;
            --color-surface: #1a1a2e;
            --color-text: #e8e8f0;
            --color-text-muted: #8a8aa0;
            --color-border: #2a2a40;
            --color-error: #ff4757;
            --color-success: #2ed573;
            --font-base: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

            --glass-bg: rgba(26, 26, 46, 0.55);
            --glass-border: rgba(42, 42, 64, 0.6);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --glow-primary: 0 0 20px rgba(0, 240, 255, 0.25);
            --glow-secondary: 0 0 20px rgba(123, 47, 247, 0.25);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================================
               RESET & BASE
               ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-base);
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            line-height: 1.6;
        }

        /* ---- noise texture overlay ---- */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        /* ---- subtle grid background ---- */
        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ---- scrollbar ---- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-text-muted);
        }

        /* ============================================================
               LAYOUT
               ============================================================ */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* ---- header ---- */
        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--color-border);
        }

        .app-header__brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .app-header__logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.25rem;
            color: #0a0a0f;
            box-shadow: var(--glow-primary);
            flex-shrink: 0;
        }

        .app-header__title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-header__sub {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            font-weight: 400;
            -webkit-text-fill-color: var(--color-text-muted);
            background: none;
        }

        .connection-badge {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 1.2rem 0.5rem 0.9rem;
            border-radius: 100px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            font-size: 0.8rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .connection-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--color-text-muted);
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .connection-badge .dot.connected {
            background: var(--color-success);
            box-shadow: 0 0 12px rgba(46, 213, 115, 0.5);
        }
        .connection-badge .dot.disconnected {
            background: var(--color-error);
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.5);
        }
        .connection-badge .dot.connecting {
            background: var(--color-primary);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            animation: pulse-dot 0.8s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }

        .connection-badge__label {
            color: var(--color-text-muted);
        }
        .connection-badge__status {
            color: var(--color-text);
            font-weight: 600;
        }

        /* ---- status cards grid ---- */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .status-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
            opacity: 0.6;
            transition: var(--transition);
        }

        .status-card:hover {
            border-color: rgba(0, 240, 255, 0.25);
            box-shadow: var(--glass-shadow), var(--glow-primary);
            transform: translateY(-2px);
        }

        .status-card__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .status-card__icon {
            font-size: 1.5rem;
            line-height: 1;
            opacity: 0.8;
        }

        .status-card__label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--color-text-muted);
            font-weight: 600;
        }

        .status-card__value {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--color-text);
            line-height: 1.2;
            word-break: break-word;
        }

        .status-card__value .unit {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text-muted);
            margin-left: 0.2rem;
        }

        .status-card__meta {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-card__meta .badge {
            display: inline-block;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .badge.ok {
            background: rgba(46, 213, 115, 0.15);
            color: var(--color-success);
        }
        .badge.warn {
            background: rgba(255, 45, 85, 0.15);
            color: var(--color-accent);
        }
        .badge.info {
            background: rgba(0, 240, 255, 0.12);
            color: var(--color-primary);
        }

        /* ---- log feed ---- */
        .log-section {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
            overflow: hidden;
        }

        .log-section__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--color-border);
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .log-section__title {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--color-text);
        }

        .log-section__title .count {
            font-size: 0.75rem;
            background: var(--color-surface);
            padding: 0.1rem 0.6rem;
            border-radius: 6px;
            color: var(--color-text-muted);
            font-weight: 500;
        }

        .log-controls {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .log-controls button {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            color: var(--color-text-muted);
            padding: 0.35rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-base);
        }

        .log-controls button:hover {
            background: var(--color-border);
            color: var(--color-text);
            border-color: var(--color-text-muted);
        }

        .log-controls button:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .log-controls .clear-btn {
            color: var(--color-accent);
            border-color: rgba(255, 45, 85, 0.3);
        }
        .log-controls .clear-btn:hover {
            background: rgba(255, 45, 85, 0.12);
            border-color: var(--color-accent);
        }

        .log-feed {
            height: 380px;
            overflow-y: auto;
            padding: 0.75rem 1.5rem 1rem;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.8rem;
            line-height: 1.7;
            background: rgba(0, 0, 0, 0.25);
        }

        .log-entry {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.25rem 0;
            border-bottom: 1px solid rgba(42, 42, 64, 0.3);
            animation: log-in 0.25s ease-out;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        @keyframes log-in {
            0% {
                opacity: 0;
                transform: translateY(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .log-entry__time {
            color: var(--color-text-muted);
            flex-shrink: 0;
            font-size: 0.7rem;
            min-width: 5.5rem;
            opacity: 0.7;
            padding-top: 0.1rem;
        }

        .log-entry__level {
            flex-shrink: 0;
            min-width: 4rem;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.05rem 0.4rem;
            border-radius: 4px;
            text-align: center;
            margin-top: 0.05rem;
        }

        .log-entry__level.info {
            background: rgba(0, 240, 255, 0.1);
            color: var(--color-primary);
        }
        .log-entry__level.warn {
            background: rgba(255, 45, 85, 0.1);
            color: var(--color-accent);
        }
        .log-entry__level.ok {
            background: rgba(46, 213, 115, 0.1);
            color: var(--color-success);
        }
        .log-entry__level.error {
            background: rgba(255, 71, 87, 0.15);
            color: var(--color-error);
        }
        .log-entry__level.sys {
            background: rgba(123, 47, 247, 0.1);
            color: var(--color-secondary);
        }

        .log-entry__msg {
            color: var(--color-text);
            word-break: break-word;
            flex: 1;
        }

        .log-entry__msg .highlight {
            color: var(--color-primary);
        }
        .log-entry__msg .highlight-error {
            color: var(--color
