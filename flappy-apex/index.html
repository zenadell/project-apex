<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
  body { display: flex; justify-content: center; align-items: center; }
  canvas {
    display: block;
    background: #70c5ce;
    image-rendering: pixelated;
    max-width: 100%;
    max-height: 100%;
  }
  #container {
    position: relative;
    width: 400px;
    height: 600px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 400 / 600;
  }
  canvas { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="container">
  <canvas id="game" width="400" height="600"></canvas>
</div>
<script>
(function() {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 400, H = 600;
  canvas.width = W;
  canvas.height = H;

  // ── Constants ──
  const GRAVITY = 0.4;
  const FLAP_VEL = -6;
  const PIPE_W = 60;
  const PIPE_GAP = 160;
  const PIPE_SPACING = 280;
  const BIRD_W = 34;
  const BIRD_H = 24;
  const GROUND_H = 80;
  const PLAYABLE_H = H - GROUND_H;

  // ── Game State ──
  let state = 'ready'; // ready | playing | game-over
  let score = 0;
  let highScore = 0;
  let frame = 0;

  // ── Bird ──
  const bird = { x: 80, y: H / 2, w: BIRD_W, h: BIRD_H, vel: 0, rotation: 0 };
  // Wing animation frames: 3 frames cycled every 8 game frames
  const wingFrames = [
    function(ctx, x, y, w, h) {
      // Frame 0: wings up
      ctx.fillStyle = '#f5c842';
      ctx.beginPath();
      ctx.ellipse(x, y, w/2, h/2, 0, 0, Math.PI * 2);
      ctx.fill();
      // wing up
      ctx.fillStyle = '#e8a317';
      ctx.beginPath();
      ctx.ellipse(x - 6, y - 12, 8, 6, -0.3, 0, Math.PI * 2);
      ctx.fill();
      // eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x + 6, y - 4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(x + 8, y - 5, 2.5, 0, Math.PI * 2);
      ctx.fill();
      // beak
      ctx.fillStyle = '#e85d04';
      ctx.beginPath();
      ctx.moveTo(x + 16, y - 2);
      ctx.lineTo(x + 26, y);
      ctx.lineTo(x + 16, y + 3);
      ctx.fill();
    },
    function(ctx, x, y, w, h) {
      // Frame 1: wings mid
      ctx.fillStyle = '#f5c842';
      ctx.beginPath();
      ctx.ellipse(x, y, w/2, h/2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e8a317';
      ctx.beginPath();
      ctx.ellipse(x - 4, y - 8, 8, 6, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x + 6, y - 4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(x + 8, y - 5, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e85d04';
      ctx.beginPath();
      ctx.moveTo(x + 16, y - 2);
      ctx.lineTo(x + 26, y);
      ctx.lineTo(x + 16, y + 3);
      ctx.fill();
    },
    function(ctx, x, y, w, h) {
      // Frame 2: wings down
      ctx.fillStyle = '#f5c842';
      ctx.beginPath();
      ctx.ellipse(x, y, w/2, h/2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e8a317';
      ctx.beginPath();
      ctx.ellipse(x - 2, y - 4, 8, 6, -0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x + 6, y - 4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(x + 8, y - 5, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e85d04';
      ctx.beginPath();
      ctx.moveTo(x + 16, y - 2);
      ctx.lineTo(x + 26, y);
      ctx.lineTo(x + 16, y + 3);
      ctx.fill();
    }
  ];

  function drawBird() {
    const wingIdx = state === 'playing' ? Math.floor(frame / 8) % 3 : 0;
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);
    wingFrames[wingIdx](ctx, 0, 0, BIRD_W, BIRD_H);
    ctx.restore();
  }

  // ── Pipes ──
  let pipes = [];
  let pipeSpeed = 2.5;
  let gapSize = PIPE_GAP;
  let nextPipeFrame = PIPE_SPACING;

  function createPipe() {
    const gapStart = 60 + Math.random() * (PLAYABLE_H - gapSize - 120);
    const topH = gapStart;
    const bottomY = gapStart + gapSize;
    pipes.push({
      x: W + 20,
      topH: topH,
      bottomY: bottomY,
      scored: false
    });
  }

  function drawPipe(pipe) {
    // Gradient for top pipe
    const topGrad = ctx.createLinearGradient(pipe.x, 0, pipe.x + PIPE_W, 0);
    topGrad.addColorStop(0, '#3a7d3a');
    topGrad.addColorStop(0.2, '#5cb85c');
    topGrad.addColorStop(0.5, '#6fcf6f');
    topGrad.addColorStop(0.8, '#5cb85c');
    topGrad.addColorStop(1, '#3a7d3a');

    // Top pipe body
    ctx.fillStyle = topGrad;
    ctx.fillRect(pipe.x, 0, PIPE_W, pipe.topH);

    // Top pipe lip
    ctx.fillStyle = '#4a9e4a';
    ctx.fillRect(pipe.x - 4, pipe.topH - 30, PIPE_W + 8, 30);
    ctx.strokeStyle = '#2d5a2d';
    ctx.lineWidth = 2;
    ctx.strokeRect(pipe.x - 4, pipe.topH - 30, PIPE_W + 8, 30);

    // Bottom pipe gradient
    const botGrad = ctx.createLinearGradient(pipe.x, pipe.bottomY, pipe.x + PIPE_W, pipe.bottomY);
    botGrad.addColorStop(0, '#3a7d3a');
    botGrad.addColorStop(0.2, '#5cb85c');
    botGrad.addColorStop(0.5, '#6fcf6f');
    botGrad.addColorStop(0.8, '#5cb85c');
    botGrad.addColorStop(1, '#3a7d3a');

    ctx.fillStyle = botGrad;
    ctx.fillRect(pipe.x, pipe.bottomY, PIPE_W, H - pipe.bottomY - GROUND_H);

    // Bottom pipe lip
    ctx.fillStyle = '#4a9e4a';
    ctx.fillRect(pipe.x - 4, pipe.bottomY, PIPE_W + 8, 30);
    ctx.strokeStyle = '#2d5a2d';
    ctx.lineWidth = 2;
    ctx.strokeRect(pipe.x - 4, pipe.bottomY, PIPE_W + 8, 30);
  }

  // ── Ground ──
  let groundOffset = 0;

  function drawGround() {
    const y = H - GROUND_H;
    ctx.fillStyle = '#d4a373';
    ctx.fillRect(0, y, W, GROUND_H);
    ctx.fillStyle = '#b5835a';
    ctx.fillRect(0, y, W, 4);
    // road markings
    ctx.strokeStyle = '#fefae0';
    ctx.lineWidth = 2;
    ctx.setLineDash([16, 20]);
    ctx.beginPath();
    ctx.moveTo(groundOffset % 40 - 40, y + GROUND_H / 2);
    ctx.lineTo(400, y + GROUND_H / 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // ── Clouds (background) ──
  const clouds = [
    { x: 50, y: 60, w: 80, h: 30 },
    { x: 220, y: 40, w: 100, h: 35 },
    { x: 350, y: 80, w: 70, h: 25 }
  ];

  function drawClouds() {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(c.x - c.w * 0.25, c.y + 5, c.w * 0.3, c.h * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(c.x + c.w * 0.25, c.y + 4, c.w * 0.35, c.h * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // ── Score ──
  function drawScore() {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = 'bold 48px Arial, sans-serif';
    ctx.textAlign = 'center';
    if (state === 'playing' || state === 'game-over') {
      ctx.strokeText(score.toString(), W / 2, 60);
      ctx.fillText(score.toString(), W / 2, 60);
    }
  }

  function drawReadyMessage() {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = 'bold 36px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('Flappy Bird', W / 2, 160);
    ctx.fillText('Flappy Bird', W / 2, 160);

    ctx.font = 'bold 20px Arial, sans-serif';
    ctx.strokeText('Tap / Click / Space', W / 2, 210);
    ctx.fillText('Tap / Click / Space', W / 2, 210);

    // Draw a small bird icon bouncing
    const bounce = Math.sin(Date.now() / 300) * 5;
    ctx.save();
    ctx.translate(W / 2, 300 + bounce);
    wingFrames[1](ctx, 0, 0, BIRD_W, BIRD_H);
    ctx.restore();
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#deb887';
    ctx.strokeStyle = '#8b4513';
    ctx.lineWidth = 4;
    const boxX = W / 2 - 130, boxY = H / 2 - 90, boxW = 260, boxH = 180;
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeRect(boxX, boxY, boxW, boxH);

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = 'bold 32px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('Game Over', W / 2, boxY + 45);
    ctx.fillText('Game Over', W / 2, boxY + 45);

    ctx.font = 'bold 20px Arial, sans-serif';
    ctx.strokeText('Score: ' + score, W / 2, boxY + 85);
    ctx.fillText('Score: ' + score, W / 2, boxY + 85);
    ctx.strokeText('Best: ' + highScore, W / 2, boxY + 115);
    ctx.fillText('Best: ' + highScore, W / 2, boxY + 115);

    ctx.font = 'bold 16px Arial, sans-serif';
    ctx.strokeText('Tap / Click / Space to restart', W / 2, boxY + 155);
    ctx.fillText('Tap / Click / Space to restart', W / 2, boxY + 155);
  }

  // ── Collision (AABB) ──
  function birdRect() {
    return { x: bird.x - BIRD_W / 2, y: bird.y - BIRD_H / 2, w: BIRD_W, h: BIRD_H };
  }

  function aabbCollision(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function checkCollisions() {
    const br = birdRect();

    // Ground / ceiling
    if (br.y + br.h >= H - GROUND_H || br.y <= 0) {
      return true;
    }

    // Pipes
    for (const pipe of pipes) {
      // Top pipe body
      if (aabbCollision(br, { x: pipe.x, y: 0, w: PIPE_W, h: pipe.topH })) {
        return true;
      }
      // Bottom pipe body
      if (aabbCollision(br, { x: pipe.x, y: pipe.bottomY, w: PIPE_W, h: H - pipe.bottomY - GROUND_H })) {
        return true;
      }
    }
    return false;
  }

  // ── Difficulty ──
  function updateDifficulty() {
    const milestone = Math.floor(score / 5);
    if (milestone >= 1) {
      gapSize = PIPE_GAP * Math.pow(0.95, milestone);
      if (gapSize < 80) gapSize = 80;
      pipeSpeed = 2.5 * Math.pow(1.1, milestone);
      if (pipeSpeed > 8) pipeSpeed = 8;
    }
  }

  // ── Reset ──
  function resetGame() {
    state = 'ready';
    score = 0;
    frame = 0;
    bird.y = H / 2;
    bird.vel = 0;
    bird.rotation = 0;
    pipes = [];
    nextPipeFrame = PIPE_SPACING;
    gapSize = PIPE_GAP;
    pipeSpeed = 2.5;
    groundOffset = 0;
  }

  // ── Flap ──
  function flap() {
    if (state === 'ready') {
      state = 'playing';
      bird.vel = FLAP_VEL;
      bird.y += bird.vel;
    } else if (state === 'playing') {
      bird.vel = FLAP_VEL;
    } else if (state === 'game-over') {
      resetGame();
    }
  }

  // ── Input ──
  let inputLocked = false;
  let doubleJumpGuard = false;

  function handleInput(e) {
    // Prevent default for spacebar/click/touch to avoid scrolling
    if (e.type === 'keydown') {
      if (e.code !== 'Space') return;
      e.preventDefault();
    }
    if (e.type === 'click' || e.type === 'mousedown' || e.type === 'touchstart') {
      e.preventDefault();
    }

    // Double-jump guard: if we just handled input, ignore
    if (doubleJumpGuard) return;
    doubleJumpGuard = true;
    setTimeout(() => { doubleJumpGuard = false; }, 100);

    flap();
  }

  // Bind input with passive: false for preventDefault to work
  document.addEventListener('keydown', handleInput);
  canvas.addEventListener('mousedown', handleInput);
  canvas.addEventListener('touchstart', handleInput, { passive: false });
  canvas.addEventListener('click', handleInput);

  // Prevent context menu on canvas
  canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  // ── Update ──
  function update() {
    frame++;

    if (state === 'playing') {
      // Bird physics
      bird.vel += GRAVITY;
      bird.y += bird.vel;

      // Rotation based on velocity
      if (bird.vel < -2) {
        bird.rotation = -0.5;
      } else if (bird.vel > 3) {
        bird.rotation = 0.8;
      } else {
        bird.rotation = bird.vel * 0.15;
      }

      // Ground scroll
      groundOffset += pipeSpeed;

      // Clouds scroll
      clouds.forEach(c => { c.x -= 0.3; if (c.x + c.w < 0) c.x = W + c.w; });

      // Pipes
      nextPipeFrame -= pipeSpeed;
      if (nextPipeFrame <= 0) {
        createPipe();
        nextPipeFrame = PIPE_SPACING;
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= pipeSpeed;
        if (pipes[i].x + PIPE_W < 0) {
          pipes.splice(i, 1);
          continue;
        }
        // Score
        if (!pipes[i].scored && pipes[i].x + PIPE_W < bird.x) {
          pipes[i].scored = true;
          score++;
          updateDifficulty();
        }
      }

      // Collision
      if (checkCollisions()) {
        state = 'game-over';
        if (score > highScore) highScore = score;
      }
    } else if (state === 'ready') {
      // Gentle bird bob
      bird.y = H / 2 + Math.sin(Date.now() / 300) * 8;
    }
  }

  // ── Render ──
  function render() {
    ctx.clearRect(0, 0, W, H);

    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#4dc9f6');
    skyGrad.addColorStop(1, '#70c5ce');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    drawClouds();

    // Pipes
    pipes.forEach(drawPipe);

    drawGround();

    // Bird
    drawBird();

    drawScore();

    if (state === 'ready') {
      drawReadyMessage();
    }

    if (state === 'game-over') {
      drawGameOver();
    }
  }

  // ── Game Loop ──
  function gameLoop(timestamp) {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  // ── Start ──
  resetGame();
  requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
